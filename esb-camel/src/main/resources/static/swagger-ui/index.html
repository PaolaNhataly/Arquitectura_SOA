<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ESB Tarea 2 — Documentación API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"/>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                // Camel publica el documento OpenAPI en /api-doc gracias a
                // restConfiguration().apiContextPath("/api-doc") en EsbRoutes
                url: "/api-doc",
                dom_id: "#swagger-ui"
            });
        };
    </script>
</body>
</html>
